<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>The Big Reveal - Under the Lens</title>
<style>
  :root{
    --pink: #ff8fc7;
    --pink-deep: #ff5fae;
    --blue: #7ec8ff;
    --blue-deep: #3fa9ff;
    --gold: #ffd76a;
    --ink: #3a3355;
    --steel: #aab4c2;
    --steel-dark: #5c6674;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    font-family: 'Segoe UI', Verdana, Tahoma, sans-serif;
    overflow: hidden;
    background: linear-gradient(160deg, #eaf6ff 0%, #eae2ff 45%, #ffe3f1 100%);
    -webkit-user-select:none; user-select:none;
  }
  #sky{ position: fixed; inset:0; z-index:0; overflow:hidden; }
  .cloud{
    position:absolute; opacity:.7; background:#fff; border-radius:50px; filter: blur(1px);
    animation: drift linear infinite;
  }
  @keyframes drift{
    from{ transform: translateX(-20vw); }
    to{ transform: translateX(120vw); }
  }

  .stage{
    position: relative; z-index: 2;
    min-height: 100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 20px; text-align:center;
  }

  h1{
    font-size: clamp(1.4rem, 4.6vw, 2.4rem);
    color: var(--ink);
    margin: 0 0 4px;
    text-shadow: 0 2px 0 #fff;
  }
  .subtitle{
    color: #6d6389;
    font-size: clamp(.85rem, 2vw, 1.05rem);
    margin: 0 0 20px;
    max-width: 480px;
  }

  /* --- Microscope view --- */
  .scope-area{
    display:flex; align-items:center; justify-content:center; gap: clamp(14px, 4vw, 34px);
    flex-wrap: nowrap;
  }

  .eyepiece{
    width: min(56vw, 300px);
    height: min(56vw, 300px);
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #6b7684, #23282f 55%, #0d0f12 100%);
    box-shadow: 0 16px 40px rgba(30,20,60,.35), inset 0 0 0 6px #10131a, inset 0 0 30px rgba(0,0,0,.6);
    padding: 14px;
    position: relative;
    flex-shrink: 0;
  }
  .eyepiece::before{
    content:'';
    position:absolute; inset: 4px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.08);
    pointer-events:none;
  }
  .lens-glass{
    width:100%; height:100%;
    border-radius:50%;
    overflow:hidden;
    position: relative;
    background: #cfe9d8;
  }
  .specimen{
    position:absolute; inset: -12%;
    filter: blur(18px);
    will-change: filter;
    transition: filter .05s linear;
  }
  .specimen.snap{
    transition: filter .6s cubic-bezier(.3,.6,.35,1);
  }
  .cell{
    position:absolute;
    border-radius: 50%;
    mix-blend-mode: multiply;
    opacity: .8;
  }
  .hidden-text{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction: column;
    line-height: 0.95;
    font-weight: 900;
    color: var(--blue-deep);
    font-size: clamp(1.3rem, 6.5vw, 2.1rem);
    letter-spacing: 1px;
    text-shadow: 0 0 1px rgba(255,255,255,.6);
  }
  .hidden-text span{ display:block; }

  .vignette{
    position:absolute; inset:0;
    border-radius:50%;
    background: radial-gradient(circle, rgba(0,0,0,0) 58%, rgba(0,0,0,.55) 100%);
    pointer-events:none;
  }
  .crosshair-h, .crosshair-v{
    position:absolute; background: rgba(20,30,20,.28); pointer-events:none;
  }
  .crosshair-h{ left:6%; right:6%; top:50%; height:1px; transform: translateY(-50%); }
  .crosshair-v{ top:6%; bottom:6%; left:50%; width:1px; transform: translateX(-50%); }

  /* --- Focus knob --- */
  .focus-control{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    flex-shrink: 0;
  }
  .knob-ring{
    width: min(24vw, 120px);
    height: min(24vw, 120px);
    border-radius:50%;
    padding: 8px;
    background: conic-gradient(var(--blue-deep) calc(var(--progress, 0) * 1%), #e3e8f0 0);
    box-shadow: 0 6px 16px rgba(90,60,140,.18);
    display:flex; align-items:center; justify-content:center;
    transition: box-shadow .2s ease;
  }
  .knob-ring.done{
    box-shadow: 0 0 0 4px rgba(63,169,255,.35), 0 6px 16px rgba(90,60,140,.18);
  }
  .knob{
    width: 100%; height:100%;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #f4f6f9, var(--steel) 55%, var(--steel-dark) 100%);
    box-shadow: 0 6px 14px rgba(0,0,0,.25), inset 0 2px 4px rgba(255,255,255,.6), inset 0 -4px 8px rgba(0,0,0,.25);
    position: relative;
    cursor: grab;
    touch-action: none;
  }
  .knob:active{ cursor: grabbing; }
  .knob-notch{
    position:absolute; top:10%; left:50%; width:6px; height:22%;
    background: var(--pink-deep);
    border-radius: 3px;
    transform: translateX(-50%);
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .knob-grip{
    position:absolute; inset:0; border-radius:50%;
    background:
      repeating-conic-gradient(rgba(0,0,0,.08) 0deg 4deg, transparent 4deg 18deg);
  }
  .knob-label{
    font-size: .78rem; font-weight:700; letter-spacing: 1.5px;
    color: #7a7398;
  }

  .hint{
    margin-top: 18px;
    color: #8880a3;
    font-size: .85rem;
    min-height: 1.2em;
  }
  .auto-link{
    color: var(--blue-deep);
    text-decoration: underline;
    cursor: pointer;
    font-size: .8rem;
  }
  .auto-link[hidden]{ display:none; }

  /* --- Result banner (shared look with the box version) --- */
  #result{
    position: fixed; inset:0; z-index: 5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.55), rgba(126,200,255,.35) 60%, rgba(126,200,255,0) 100%);
    opacity:0; pointer-events:none;
    transition: opacity .5s ease;
  }
  #result.show{ opacity:1; }
  #result h2{
    font-size: clamp(2.2rem, 9vw, 5rem);
    margin:0;
    color: var(--blue-deep);
    text-shadow: 0 3px 0 #fff, 0 10px 26px rgba(63,169,255,.45);
    transform: scale(0.4);
    opacity:0;
  }
  #result.show h2{
    animation: pop .7s cubic-bezier(.34,1.56,.64,1) .1s forwards;
  }
  @keyframes pop{
    to{ transform: scale(1); opacity:1; }
  }
  #result p{
    font-size: clamp(1rem, 3vw, 1.3rem);
    color: #4c6a8a;
    margin-top: 10px;
    opacity:0;
    transition: opacity .6s ease .6s;
  }
  #result.show p{ opacity:1; }

  canvas#confetti{ position: fixed; inset:0; z-index: 6; pointer-events:none; }

  .balloon{
    position: fixed; bottom: -140px;
    width: 56px; height: 70px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    z-index: 4; opacity: .95;
  }
  .balloon::after{
    content:''; position:absolute; left:50%; bottom:-46px; width:2px; height:46px;
    background: rgba(80,80,100,.4); transform: translateX(-50%);
  }
  @keyframes floatUp{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); }
    50%{ transform: translateY(-58vh) translateX(var(--drift,20px)) rotate(6deg); }
    100%{ transform: translateY(-115vh) translateX(0) rotate(-6deg); }
  }
</style>
</head>
<body>

<div id="sky"></div>
<canvas id="confetti"></canvas>

<div class="stage">
  <h1>Let's take a closer look... 🔬</h1>
  <p class="subtitle">Turn the focus knob until the picture becomes clear!</p>

  <div class="scope-area">
    <div class="eyepiece">
      <div class="lens-glass">
        <div class="specimen" id="specimen">
          <div class="cell" style="width:34%; height:34%; left:6%; top:10%; background: radial-gradient(circle, #bfe3c8, #7fcf9a 70%, transparent 100%);"></div>
          <div class="cell" style="width:26%; height:26%; left:58%; top:6%; background: radial-gradient(circle, #cfe6ff, #8ecbff 70%, transparent 100%);"></div>
          <div class="cell" style="width:22%; height:22%; left:8%; top:56%; background: radial-gradient(circle, #d8f2e0, #9adcb1 70%, transparent 100%);"></div>
          <div class="cell" style="width:30%; height:30%; left:62%; top:54%; background: radial-gradient(circle, #e5d9ff, #b7a3f2 70%, transparent 100%);"></div>
          <div class="cell" style="width:18%; height:18%; left:40%; top:66%; background: radial-gradient(circle, #cdeeff, #86c9ef 70%, transparent 100%);"></div>
          <div class="cell" style="width:16%; height:16%; left:36%; top:4%; background: radial-gradient(circle, #d3f4dd, #96d9ac 70%, transparent 100%);"></div>
          <div class="hidden-text"><span>IT'S A</span><span>BOY!</span></div>
        </div>
        <div class="crosshair-h"></div>
        <div class="crosshair-v"></div>
        <div class="vignette"></div>
      </div>
    </div>

    <div class="focus-control">
      <div class="knob-ring" id="knobRing">
        <div class="knob" id="knob">
          <div class="knob-grip"></div>
          <div class="knob-notch" id="knobNotch"></div>
        </div>
      </div>
      <div class="knob-label">FOCUS</div>
    </div>
  </div>

  <div class="hint" id="hint">Click and drag the knob in a circle to focus the lens</div>
  <div class="auto-link" id="autoLink">Trouble with the knob? Tap here to auto-focus</div>
</div>

<div id="result">
  <h2>IT'S A BOY! 💙</h2>
  <p>That means blue balloons and tiny blue microscopes!</p>
</div>

<script>
// ---------- decorative drifting clouds ----------
(function initClouds(){
  const sky = document.getElementById('sky');
  for(let i=0;i<5;i++){
    const c = document.createElement('div');
    c.className = 'cloud';
    const w = 80 + Math.random()*100;
    c.style.width = w+'px';
    c.style.height = (w*0.45)+'px';
    c.style.top = (5 + Math.random()*55) + 'vh';
    c.style.animationDuration = (40 + Math.random()*35) + 's';
    c.style.animationDelay = (-Math.random()*40) + 's';
    sky.appendChild(c);
  }
})();

// ---------- focus-knob interaction ----------
const knob = document.getElementById('knob');
const knobRing = document.getElementById('knobRing');
const knobNotch = document.getElementById('knobNotch');
const specimen = document.getElementById('specimen');
const hint = document.getElementById('hint');
const autoLink = document.getElementById('autoLink');
const resultEl = document.getElementById('result');

const MAX_ROTATION = 900;   // degrees of turning needed to fully focus (2.5 turns)
const MAX_BLUR = 18;        // px, matches the initial CSS blur

let progressDeg = 0;        // 0..MAX_ROTATION
let dragging = false;
let lastAngle = 0;
let done = false;

function angleFromEvent(e, rect){
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  return Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
}

function shortestDelta(from, to){
  let d = to - from;
  while(d > 180) d -= 360;
  while(d < -180) d += 360;
  return d;
}

function applyProgress(){
  const pct = Math.max(0, Math.min(1, progressDeg / MAX_ROTATION));
  const blur = MAX_BLUR * (1 - pct);
  specimen.style.filter = `blur(${blur}px)`;
  knobRing.style.setProperty('--progress', Math.round(pct*100));
  knobNotch.style.transform = `translateX(-50%) rotate(${progressDeg % 360}deg)`;

  if(pct >= 1 && !done){
    finishFocus();
  }
}

function finishFocus(){
  done = true;
  specimen.classList.add('snap');
  specimen.style.filter = 'blur(0px)';
  knobRing.classList.add('done');
  hint.textContent = 'Perfectly focused!';
  autoLink.hidden = true;
  knob.style.pointerEvents = 'none';

  setTimeout(()=>{
    launchConfetti();
    launchBalloons();
    resultEl.classList.add('show');
  }, 500);
}

knob.addEventListener('pointerdown', (e)=>{
  if(done) return;
  dragging = true;
  knob.setPointerCapture(e.pointerId);
  const rect = knob.getBoundingClientRect();
  lastAngle = angleFromEvent(e, rect);
  hint.textContent = 'Keep turning...';
});

knob.addEventListener('pointermove', (e)=>{
  if(!dragging || done) return;
  const rect = knob.getBoundingClientRect();
  const angle = angleFromEvent(e, rect);
  const delta = shortestDelta(lastAngle, angle);
  lastAngle = angle;
  progressDeg = Math.max(0, Math.min(MAX_ROTATION, progressDeg + Math.abs(delta)));
  applyProgress();
});

function stopDrag(){ dragging = false; }
knob.addEventListener('pointerup', stopDrag);
knob.addEventListener('pointercancel', stopDrag);

autoLink.addEventListener('click', ()=>{
  if(done) return;
  autoLink.hidden = true;
  hint.textContent = 'Auto-focusing...';
  const startDeg = progressDeg;
  const remaining = MAX_ROTATION - startDeg;
  const durationMs = 2600;
  const startTime = performance.now();
  function step(now){
    const t = Math.min(1, (now - startTime) / durationMs);
    const eased = 1 - Math.pow(1 - t, 2);
    progressDeg = startDeg + remaining * eased;
    applyProgress();
    if(t < 1 && !done){
      requestAnimationFrame(step);
    }
  }
  requestAnimationFrame(step);
});

applyProgress();

// ---------- confetti ----------
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const confettiColors = ['#7ec8ff', '#3fa9ff', '#ffffff', '#ffd76a', '#bfe3ff'];
let particles = [];
let animating = false;

function launchConfetti(){
  for(let i=0;i<220;i++){
    particles.push({
      x: canvas.width/2 + (Math.random()-0.5)*120,
      y: canvas.height*0.35 + (Math.random()-0.5)*40,
      vx: (Math.random()-0.5) * 14,
      vy: -(Math.random()*14 + 6),
      size: 5 + Math.random()*6,
      color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
      rot: Math.random()*Math.PI*2,
      vr: (Math.random()-0.5) * 0.3,
      shape: Math.random() < 0.5 ? 'rect' : 'circle',
      life: 0,
      maxLife: 180 + Math.random()*60
    });
  }
  if(!animating){ animating = true; animateConfetti(); }
}

function animateConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.vy += 0.18;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, 1 - p.life/p.maxLife);
    ctx.fillStyle = p.color;
    if(p.shape === 'rect'){ ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.6); }
    else { ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  });
  particles = particles.filter(p => p.life < p.maxLife && p.y < canvas.height + 40);
  if(particles.length > 0){ requestAnimationFrame(animateConfetti); }
  else { animating = false; ctx.clearRect(0,0,canvas.width,canvas.height); }
}

let burstCount = 0;
const burstInterval = setInterval(()=>{
  if(!resultEl.classList.contains('show')) return;
  burstCount++;
  if(burstCount > 4){ clearInterval(burstInterval); return; }
  for(let i=0;i<80;i++){
    particles.push({
      x: Math.random()*canvas.width, y: -20,
      vx: (Math.random()-0.5) * 4, vy: Math.random()*3 + 2,
      size: 5 + Math.random()*6,
      color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
      rot: Math.random()*Math.PI*2, vr: (Math.random()-0.5) * 0.2,
      shape: Math.random() < 0.5 ? 'rect' : 'circle',
      life: 0, maxLife: 260 + Math.random()*80
    });
  }
  if(!animating){ animating = true; animateConfetti(); }
}, 1200);

// ---------- balloons ----------
const balloonColors = ['#7ec8ff', '#3fa9ff', '#ffffff', '#bfe3ff', '#a9d8ff'];
function launchBalloons(){
  for(let i=0;i<16;i++){
    setTimeout(()=>{
      const b = document.createElement('div');
      b.className = 'balloon';
      const color = balloonColors[Math.floor(Math.random()*balloonColors.length)];
      b.style.background = `radial-gradient(circle at 35% 30%, #ffffff 0%, ${color} 45%, ${color} 100%)`;
      b.style.left = (Math.random()*90) + 'vw';
      const dur = 6 + Math.random()*4;
      b.style.setProperty('--drift', (Math.random()*80 - 40)+'px');
      b.style.animation = `floatUp ${dur}s ease-in forwards`;
      document.body.appendChild(b);
      setTimeout(()=>b.remove(), dur*1000 + 200);
    }, i*220);
  }
}
</script>

</body>
</html>
