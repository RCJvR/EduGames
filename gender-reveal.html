<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>The Big Reveal!</title>
<style>
  :root{
    --pink: #ff8fc7;
    --pink-deep: #ff5fae;
    --blue: #7ec8ff;
    --blue-deep: #3fa9ff;
    --gold: #ffd76a;
    --ink: #3a3355;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    font-family: 'Segoe UI', Verdana, Tahoma, sans-serif;
    overflow: hidden;
    background: linear-gradient(160deg, #ffe3f1 0%, #eae2ff 45%, #dcecff 100%);
  }
  #sky{
    position: fixed; inset:0; z-index:0; overflow:hidden;
  }
  .cloud{
    position:absolute; opacity:.8;
    background: #fff;
    border-radius: 50px;
    filter: blur(1px);
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after{
    content:''; position:absolute; background:#fff; border-radius:50%;
  }
  @keyframes drift{
    from{ transform: translateX(-20vw); }
    to{ transform: translateX(120vw); }
  }

  .stage{
    position: relative; z-index: 2;
    min-height: 100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 24px; text-align:center;
  }

  h1{
    font-size: clamp(1.6rem, 5vw, 2.8rem);
    color: var(--ink);
    margin: 0 0 6px;
    text-shadow: 0 2px 0 #fff;
  }
  .subtitle{
    color: #6d6389;
    font-size: clamp(.9rem, 2.2vw, 1.15rem);
    margin: 0 0 28px;
    max-width: 480px;
  }

  /* --- The present / box roller --- */
  .box-wrap{
    perspective: 1200px;
    margin-bottom: 34px;
  }
  .present{
    width: min(72vw, 320px);
    height: min(72vw, 320px);
    position: relative;
    animation: idleBob 3s ease-in-out infinite;
  }
  @keyframes idleBob{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-8px) rotate(-1deg); }
  }
  .present.shaking{
    animation: shake 0.12s linear infinite;
  }
  @keyframes shake{
    0%{ transform: translate(0,0) rotate(0deg); }
    25%{ transform: translate(-4px,2px) rotate(-1.5deg); }
    50%{ transform: translate(4px,-2px) rotate(1.5deg); }
    75%{ transform: translate(-3px,-2px) rotate(-1deg); }
    100%{ transform: translate(0,0) rotate(0deg); }
  }
  .present.launched{
    animation: launch 0.9s cubic-bezier(.5,-0.3,.6,1.4) forwards;
  }
  @keyframes launch{
    0%{ transform: translateY(0) scale(1) rotate(0deg); }
    35%{ transform: translateY(-60px) scale(1.08) rotate(6deg); }
    60%{ transform: translateY(-40px) scale(1.15) rotate(-4deg); }
    100%{ transform: translateY(-10px) scale(1.05) rotate(0deg); }
  }

  .box-body{
    position:absolute; left:8%; right:8%; bottom:0; top: 34%;
    background: linear-gradient(135deg, #fff 0%, #ffeef7 100%);
    border-radius: 18px;
    box-shadow: 0 18px 40px rgba(120,80,150,.28), inset 0 0 0 3px #fff;
    border: 4px solid var(--pink-deep);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .box-lid{
    position:absolute; left:2%; right:2%; top:0; height: 42%;
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    border-radius: 16px 16px 6px 6px;
    box-shadow: 0 8px 18px rgba(120,80,150,.3);
    transform-origin: bottom center;
    transition: transform .5s cubic-bezier(.6,-0.2,.7,1.4);
    z-index: 3;
  }
  .present.opened .box-lid{
    transform: rotateX(115deg) translateY(-10px);
  }
  .ribbon-v{
    position:absolute; left:50%; top:0; bottom:0; width: 14%;
    transform: translateX(-50%);
    background: var(--gold);
    z-index:2;
  }
  .box-lid .ribbon-v{ width:16%; }
  .bow{
    position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    font-size: 2.4rem; z-index:4; filter: drop-shadow(0 4px 6px rgba(0,0,0,.15));
  }

  .reel-window{
    position:absolute; inset: 10%;
    display:flex; align-items:center; justify-content:center;
    z-index:1;
  }
  .reel-label{
    font-size: clamp(1.1rem, 4.4vw, 1.9rem);
    font-weight: 800;
    white-space: nowrap;
    letter-spacing: .5px;
  }
  .reel-label.boy{ color: var(--blue-deep); }
  .reel-label.girl{ color: var(--pink-deep); }
  .reel-label.mystery{ color: var(--ink); opacity: .55; }

  /* --- Button --- */
  #revealBtn{
    font-size: clamp(1rem, 3vw, 1.3rem);
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--pink-deep), var(--blue-deep));
    border: none;
    padding: 16px 38px;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(90,60,140,.35);
    transition: transform .15s ease, box-shadow .15s ease, opacity .3s ease;
  }
  #revealBtn:hover{ transform: translateY(-2px) scale(1.03); box-shadow: 0 14px 30px rgba(90,60,140,.4); }
  #revealBtn:active{ transform: translateY(0) scale(.98); }
  #revealBtn:disabled{ opacity:0; pointer-events:none; }

  .hint{
    margin-top: 14px;
    color: #8880a3;
    font-size: .85rem;
    min-height: 1.2em;
  }

  /* --- Result banner --- */
  #result{
    position: fixed; inset:0; z-index: 5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.55), rgba(126,200,255,.35) 60%, rgba(126,200,255,0) 100%);
    opacity:0; pointer-events:none;
    transition: opacity .5s ease;
  }
  #result.show{ opacity:1; }
  #result h2{
    font-size: clamp(2.2rem, 9vw, 5rem);
    margin:0;
    color: var(--blue-deep);
    text-shadow: 0 3px 0 #fff, 0 10px 26px rgba(63,169,255,.45);
    transform: scale(0.4);
    opacity:0;
  }
  #result.show h2{
    animation: pop .7s cubic-bezier(.34,1.56,.64,1) .15s forwards;
  }
  @keyframes pop{
    to{ transform: scale(1); opacity:1; }
  }
  #result p{
    font-size: clamp(1rem, 3vw, 1.3rem);
    color: #4c6a8a;
    margin-top: 10px;
    opacity:0;
    transition: opacity .6s ease .8s;
  }
  #result.show p{ opacity:1; }

  canvas#confetti{
    position: fixed; inset:0; z-index: 6; pointer-events:none;
  }

  .balloon{
    position: fixed;
    bottom: -140px;
    width: 56px; height: 70px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    z-index: 4;
    opacity: .95;
  }
  .balloon::after{
    content:''; position:absolute; left:50%; bottom:-46px; width:2px; height:46px;
    background: rgba(80,80,100,.4); transform: translateX(-50%);
  }
  @keyframes floatUp{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); }
    50%{ transform: translateY(-58vh) translateX(var(--drift,20px)) rotate(6deg); }
    100%{ transform: translateY(-115vh) translateX(0) rotate(-6deg); }
  }
</style>
</head>
<body>

<div id="sky"></div>

<canvas id="confetti"></canvas>

<div class="stage">
  <h1>Are you ready for the big news? 🎉</h1>
  <p class="subtitle">Give the present a shake and see what pops out...</p>

  <div class="box-wrap">
    <div class="present" id="present">
      <div class="box-lid" id="lid">
        <div class="ribbon-v"></div>
      </div>
      <div class="bow">🎀</div>
      <div class="box-body">
        <div class="reel-window">
          <span class="reel-label mystery" id="reelLabel">❔ ❔ ❔</span>
        </div>
      </div>
    </div>
  </div>

  <button id="revealBtn">🎁 Shake the Box!</button>
  <div class="hint" id="hint"></div>
</div>

<div id="result">
  <h2>IT'S A BOY! 💙</h2>
  <p>Get ready for blue balloons and tiny sneakers!</p>
</div>

<script>
// ---------- decorative drifting clouds ----------
(function initClouds(){
  const sky = document.getElementById('sky');
  const n = 5;
  for(let i=0;i<n;i++){
    const c = document.createElement('div');
    c.className = 'cloud';
    const w = 80 + Math.random()*100;
    const h = w * 0.45;
    c.style.width = w+'px';
    c.style.height = h+'px';
    c.style.top = (5 + Math.random()*55) + 'vh';
    c.style.animationDuration = (40 + Math.random()*35) + 's';
    c.style.animationDelay = (-Math.random()*40) + 's';
    sky.appendChild(c);
  }
})();

// ---------- the roller / suspense logic ----------
const revealBtn = document.getElementById('revealBtn');
const reelLabel = document.getElementById('reelLabel');
const present = document.getElementById('present');
const hint = document.getElementById('hint');
const resultEl = document.getElementById('result');

const STATES = [
  { text: '💙 BOY?',  cls: 'boy'  },
  { text: '💗 GIRL?', cls: 'girl' }
];
const MYSTERY = { text: '❔ ❔ ❔', cls: 'mystery' };

function setLabel(state){
  reelLabel.textContent = state.text;
  reelLabel.className = 'reel-label ' + state.cls;
}

let running = false;

function spin(){
  if(running) return;
  running = true;
  revealBtn.disabled = true;
  present.classList.add('shaking');
  hint.textContent = 'Shaking... shaking...';

  // deceleration schedule: lots of fast alternations, slowing down,
  // guaranteed to end on BOY. Tuned so the whole spin lands around ~7.5s,
  // leaving room for the open/launch animation to fit the ~10s total.
  const delays = [
    60,65,70,75,80,90,100,110,120,135,
    150,170,190,215,245,280,320,370,430,500,
    580,670,780,900,
    700 // final pause before reveal
  ];

  let step = 0;
  let stateIdx = 0;

  function tick(){
    setLabel(STATES[stateIdx % 2]);
    stateIdx++;
    step++;

    if(step >= delays.length){
      // brief suspense: duck back to the mystery placeholder, then reveal BOY
      setLabel(MYSTERY);
      hint.textContent = '';
      setTimeout(()=>{
        setLabel(STATES[0]);
        finishReveal();
      }, 3000);
      return;
    }

    if(step > delays.length - 8){
      hint.textContent = 'Almost there...';
    }

    setTimeout(tick, delays[step]);
  }

  setTimeout(tick, delays[0]);
}

function finishReveal(){
  present.classList.remove('shaking');
  present.classList.add('opened');
  hint.textContent = '';

  setTimeout(()=>{
    present.classList.add('launched');
    launchConfetti();
    launchBalloons();
    resultEl.classList.add('show');
  }, 350);
}

revealBtn.addEventListener('click', spin);

// ---------- confetti ----------
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const confettiColors = ['#7ec8ff', '#3fa9ff', '#ffffff', '#ffd76a', '#bfe3ff'];
let particles = [];

function launchConfetti(){
  const count = 220;
  for(let i=0;i<count;i++){
    particles.push({
      x: canvas.width/2 + (Math.random()-0.5)*120,
      y: canvas.height*0.42 + (Math.random()-0.5)*40,
      vx: (Math.random()-0.5) * 14,
      vy: -(Math.random()*14 + 6),
      size: 5 + Math.random()*6,
      color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
      rot: Math.random()*Math.PI*2,
      vr: (Math.random()-0.5) * 0.3,
      shape: Math.random() < 0.5 ? 'rect' : 'circle',
      life: 0,
      maxLife: 180 + Math.random()*60
    });
  }
  if(!animating){ animating = true; animateConfetti(); }
}

let animating = false;
function animateConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.vy += 0.18; // gravity
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vr;
    p.life++;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, 1 - p.life/p.maxLife);
    ctx.fillStyle = p.color;
    if(p.shape === 'rect'){
      ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.6);
    } else {
      ctx.beginPath();
      ctx.arc(0,0,p.size/2,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  });

  particles = particles.filter(p => p.life < p.maxLife && p.y < canvas.height + 40);

  if(particles.length > 0){
    requestAnimationFrame(animateConfetti);
  } else {
    animating = false;
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }
}

// occasional confetti bursts to keep the celebration going
let burstCount = 0;
const burstInterval = setInterval(()=>{
  if(!resultEl.classList.contains('show')) return;
  burstCount++;
  if(burstCount > 4){ clearInterval(burstInterval); return; }
  for(let i=0;i<80;i++){
    particles.push({
      x: Math.random()*canvas.width,
      y: -20,
      vx: (Math.random()-0.5) * 4,
      vy: Math.random()*3 + 2,
      size: 5 + Math.random()*6,
      color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
      rot: Math.random()*Math.PI*2,
      vr: (Math.random()-0.5) * 0.2,
      shape: Math.random() < 0.5 ? 'rect' : 'circle',
      life: 0,
      maxLife: 260 + Math.random()*80
    });
  }
  if(!animating){ animating = true; animateConfetti(); }
}, 1200);

// ---------- balloons ----------
const balloonColors = ['#7ec8ff', '#3fa9ff', '#ffffff', '#bfe3ff', '#a9d8ff'];
function launchBalloons(){
  const total = 16;
  for(let i=0;i<total;i++){
    setTimeout(()=>{
      const b = document.createElement('div');
      b.className = 'balloon';
      const color = balloonColors[Math.floor(Math.random()*balloonColors.length)];
      b.style.background = `radial-gradient(circle at 35% 30%, #ffffff 0%, ${color} 45%, ${color} 100%)`;
      b.style.left = (Math.random()*90) + 'vw';
      const dur = 6 + Math.random()*4;
      b.style.setProperty('--drift', (Math.random()*80 - 40)+'px');
      b.style.animation = `floatUp ${dur}s ease-in forwards`;
      document.body.appendChild(b);
      setTimeout(()=>b.remove(), dur*1000 + 200);
    }, i*220);
  }
}
</script>

</body>
</html>
